<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 6 310 66" fill="none">
  <!-- Symbol: Modern Industrial Emblem -->
  <g transform="translate(4, 7)">
    <!-- Base Hexagon / Precision Shield -->
    <path d="M32 2L58 17V47L32 62L6 47V17L32 2Z" fill="#102D50" stroke="#F58220" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Stylized Geometric Y & W lines -->
    <path d="M18 20L32 35L46 20" stroke="#F58220" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 35V52" stroke="#F58220" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M22 40L27 50L32 44L37 50L42 40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Accent Gear Dot -->
    <circle cx="32" cy="22" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <!-- "PT YnW" -->
  <text x="76" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" fill="#102D50" letter-spacing="-0.5">
    PT <tspan fill="#F58220">YnW</tspan>
  </text>
  
  <!-- "MULTI TEKNIK PLASTINDO" -->
  <text x="76" y="51" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#1E3A8A" letter-spacing="1.2">
    MULTI TEKNIK PLASTINDO
  </text>
  
  <!-- Tagline -->
  <text x="76" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748B" letter-spacing="2.2">
    TEKNIK • INDUSTRI • INOVASI
  </text>
</svg>
